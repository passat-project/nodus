# Реальный IP клиента: туннель Cloudflare несёт его в CF-Connecting-Ip.
# $proxy_add_x_forwarded_for ДОПИСЫВАЕТ клиентский XFF — спуфинг заголовком
# обходил IP-rate-limit и подделывал IP в аудите (аудит #123). Без туннеля
# (локальный доступ) fallback — адрес соединения.
map $http_cf_connecting_ip $nodus_xff {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# ONLYOFFICE (#138): соединение апгрейдится для канала ко-эдитинга (/doc/).
map $http_upgrade $oo_connection {
    default upgrade;
    ""      close;
}

# Схема оригинального запроса для DS (#138): nodus.by за Cloudflare tunnel,
# cloudflared НЕ ставит X-Forwarded-Proto — documentserver строит абсолютные
# ссылки (кэш документа, Editor.bin) от увиденной схемы http://, браузер на
# HTTPS-странице режет их как Mixed Content → редактор падает (-1, «Редактор
# недоступен», репро 29.09 вечером). Edge Cloudflare всегда шлёт CF-Visitor;
# иначе passthrough XFP; прямой http-доступ — пусто (= схема соединения).
map $http_cf_visitor $nodus_proto {
    default $http_x_forwarded_proto;
    ~*https  https;
}

# Схема манифеста оболочки (#263): latest.json хранит ОТНОСИТЕЛЬНЫЕ url
# (переносимость между порталами), nginx абсолютизирует их на раздаче —
# за туннелем это https (см. $nodus_proto), при прямом входе — схема
# соединения (http в ЛВС без TLS). СТРОГИЕ match: сырой X-Forwarded-Proto
# в ответ не попадает — произвольные строки из заголовка не инъектируются
# в тело манифеста (security-аудит #263).
map $nodus_proto $desktop_scheme {
    ~^https$ https;
    ~^http$  http;
    default  $scheme;
}

# Кэш раздачи оболочки (#562): latest.json — единственная подвижная точка,
# его всегда перепроверяем; версии лежат в releases/<v>/ и неизменяемы, их
# можно кэшировать навсегда (в т.ч. на edge Cloudflare перед туннелем).
map $uri $desktop_cache_control {
    ~^/desktop/releases/  'public, max-age=31536000, immutable';
    default               'no-cache';
}

# Кэш для .mjs-ассетов (#1051): воркер pdf.js лежит в /assets/ с хэшем в имени
# и попадает в regex-локацию \.mjs$, а не в префиксную /assets/. Хэшированный
# файл неизменяем — кэшируем навсегда; прочие .mjs (если появятся) — перепроверять.
map $uri $nodus_asset_cache_control {
    ~^/assets/  'public, max-age=31536000, immutable';
    default     'no-cache';
}

# Сжатие текстовых ответов (AUD-023, #866): без него бандл и JSON api уходят
# втрое больше нужного. html nginx сжимает всегда и без списка (повтор в
# gzip_types даёт warn «duplicate MIME type»), остальное — по MIME: уже сжатые
# форматы (изображения, архивы, установщики оболочки) не пережимаются.
# gzip_proxied any обязателен: дефолт off не сжимает ответы ПРОКСИРУЕМОГО api
# (запросы с Via/через прокси), а WebSocket-апгрейд gzip не затрагивает.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
# Уровень 5 (дефолт 1): заметно плотнее на бандле при тех же миллисекундах.
gzip_comp_level 5;
gzip_types
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # .mjs отсутствует в mime.types nginx (<1.27): pdf.js-воркер грузится как
  # ES-модуль, браузер требует строгий JS-MIME — иначе «Expected a
  # JavaScript-or-Wasm module script» и PDF-просмотр падает на проде
  # (репро 29.09, #138; vite preview отдаёт верный MIME — песочница не ловила).
  # Regex-локация перебивает префиксную /assets/: воркер (хэш в имени,
  # ~0,4 МБ gzip) уходил без immutable и перекачивался при каждом обновлении
  # страницы. add_header сервера не наследуется при своих add_header —
  # повторяем security-набор, кэш — только для сборочных ассетов (#1051).
  location ~* \.mjs$ {
    default_type text/javascript;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control $nodus_asset_cache_control always;
    try_files $uri =404;
  }

  # Базовые security-заголовки (аудит #123): TLS терминирует туннель, HSTS
  # уйдет браузеру через него. CSP не задан осознанно (SPA + WS-гейтвей —
  # отдельное решение), rest-набор закрывает кликджекинг/MIME-сниффинг.
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header X-Frame-Options 'SAMEORIGIN' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;

  # REST API (I2)
  location /api/ {
    proxy_pass http://nodus_api:3001;
    # Текст поискового запроса (#952) — чувствительные данные: nginx пишет
    # полный request line с query string в access.log, поэтому для API его
    # не ведём (свои request-логи есть у API; поиск — search_queries, ADR-0052).
    access_log off;
    # Вложения чата (#57): дефолт nginx 1 МБ срезал бы загрузку на корню;
    # 200m = жёсткий потолок хранилища (ADR-0013), чат режет свой лимит сам.
    client_max_body_size 200m;
    # Медленные аплоады (файл на слабом исходящем канале): не рвать соединение
    # на дефолтных 60с — тело читается минутами, ответ стримится столько же.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket gateway
  location /socket.io/ {
    proxy_pass http://nodus_gateway:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    proxy_set_header X-Forwarded-Proto $nodus_proto;
  }

  # ONLYOFFICE Docs (#138): движок просмотра офисных вложений. DS проксируется
  # КОРНЕВЫМИ путями (api.js строит абсолютные /web-apps/..., канал ко-эдитинга
  # /doc/... — субпаст ломает редиректы DS; research #138, паттерн
  # ONLYOFFICE/document-server-proxy, вариант «virtual path by root»).
  # /info/, /internal/ и админпанель DS не мапятся (и сами DS-nginx режет их
  # по 127.0.0.1). Вебсокет — только /doc/; заголовки апгрейда на всём блоке
  # безвредны. Длинный read-таймаут — стриминг документа и long-poll канала.
  # Версионный префикс /<версия>-<хэш>/... — 302-редиректы DS для кэш-бастинга статики.
  location ~ ^/((web-apps|sdkjs|sdkjs-plugins|fonts|dictionaries|cache|doc|converter|command|docbuilder|welcome|healthcheck)|[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+)(/|$) {
    # Резолвинг на момент запроса (#579): DS существует только под профилем
    # office. Со статическим proxy_pass nginx резолвит имя при загрузке конфига
    # и падает в рестарт-цикл, если контейнера нет. Без DS офисные пути дают
    # 502, остальной портал живёт (фолбэк — скачивание вложения).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $nodus_documentserver_upstream http://nodus_documentserver;
    proxy_pass $nodus_documentserver_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $oo_connection;
    # Host с ПОРТОМ ($http_host, не $host): DS строит абсолютные ссылки
    # (Editor.bin в /cache, колбэки) от увиденного хоста — без порта ссылки
    # уходят на :80 и бьются мимо портала (механизм getBaseUrl у DS, #138).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $nodus_xff;
    proxy_set_header X-Forwarded-For $nodus_xff;
    # $nodus_proto, НЕ $scheme: nginx за cloudflared всегда видит http —
    # DS строил http-ссылки и HTTPS-браузер резал их как Mixed Content.
    proxy_set_header X-Forwarded-Proto $nodus_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 100m;
  }

  # Десктоп-оболочка (#254, ADR-0019): манифест и установщики раздаёт сам
  # сервер портала (I11: без GitHub/внешнего облака). Кэш — по $uri: манифест
  # no-cache (должен быть свежим сразу после выкладки), версии immutable (#562).
  location /desktop/ {
    alias /usr/share/nginx/desktop/;
    # add_header сервера не наследуется при своих add_header в location —
    # повторяем security-набор (аудит #254, security-reviewer).
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control $desktop_cache_control always;
    # Абсолютизация url манифеста (#263): tauri-plugin-updater требует
    # абсолютные URL, а latest.json один на все порталы — переписываем
    # относительные пути под домен/схему ЭТОГО входа (переменные в
    # sub_filter поддержаны с nginx 1.9.4). Минифицированный JSON из
    # scripts/desktop-manifest.mjs — паттерн матчится как есть.
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter '"url":"/desktop/' '"url":"$desktop_scheme://$http_host/desktop/';
    try_files $uri =404;
  }

  # Служебные dot-пути раздачи (.staging выкладки, .latest.json.tmp) наружу не
  # отдаются: иначе в окне копирования клиент мог бы скачать недописанный файл
  # и закэшировать его на год (#562, security-review). Regex-локация
  # перекрывает префикс /desktop/.
  location ~ ^/desktop/\. {
    return 404;
  }

  # Сборочные ассеты с хэшем в имени (vite): содержимое неизменяемо —
  # кэшируем навсегда. add_header сервера не наследуется при своих
  # add_header — повторяем security-набор (аудит #254, security-reviewer).
  location /assets/ {
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
    try_files $uri =404;
  }

  # Публичные страницы приглашения/сброса (#101): сырой одноразовый токен
  # идёт путём SPA — access-лог nginx его не пишет. Security-заголовки
  # повторяем: add_header из `location /` сюда не наследуется.
  location ~ ^/(invite|reset)/ {
    access_log off;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    # Одноразовый токен в пути: не отдаём даже same-origin Referer.
    add_header Referrer-Policy 'no-referrer' always;
    add_header Cache-Control 'no-cache' always;
    try_files $uri $uri/ /index.html;
  }

  # SPA-фолбэк: все нефайловые маршруты — на index.html. no-cache — ВСЕГДА
  # перепроверять (304 пока не изменился): без него WebView2/браузеры держали
  # страницу по эвристике — после деплоя оболочка показывала СТАРУЮ сборку
  # сколь угодно долго (фидбек 09.10 #263: «кнопки нет после 10 restarts»).
  location / {
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Cache-Control 'no-cache' always;
    try_files $uri $uri/ /index.html;
  }
}
