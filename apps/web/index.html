<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f4f2f0" />
    <!-- Одноразовые токены в пути (#101): не отдаём URL сторонним ресурсам. -->
    <meta name="referrer" content="no-referrer" />
    <title>Nodus</title>
    <!-- Дефолт — СВЕТЛАЯ тема (вердикт владельца 15.09.2026): она в :root
         без атрибута, первый визит отрисовывается сразу светлой. Persisted-
         выбор тёмной (zustand persist, ключ nodus-shell-v1) ставим до первой
         отрисовки — без вспышки светлой у вернувшегося «тёмного» пользователя. -->
    <script>
      try {
        var shellState = JSON.parse(localStorage.getItem('nodus-shell-v1'));
        if (shellState && shellState.state && shellState.state.theme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        /* битый/пустой persist — дефолтная светлая */
      }
    </script>
    <!-- Стартовая заставка (#1051): держится, пока грузятся скрипты и идёт
         вход (refresh → me), — вместо белого листа до первого кадра React.
         Живёт РЯДОМ с #root: React её не трогает; снимает первый экран
         приложения (app/boot-splash.ts, id — та же строка). Токены темы уже
         стоят скриптом выше, цвет берётся из стилей портала — обе темы. -->
    <style>
      #nodus-boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--background, #f4f2f0);
        color: var(--foreground, #16233a);
      }
      #nodus-boot-splash svg {
        width: 3rem;
        height: 3rem;
        animation: nodus-boot-breathe 1.6s ease-in-out infinite;
      }
      @keyframes nodus-boot-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #nodus-boot-splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="nodus-boot-splash" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <g stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round">
          <line x1="32" y1="22.5" x2="32" y2="13" />
          <line x1="22.91" y1="38.25" x2="14.68" y2="43" />
          <line x1="41.09" y1="38.25" x2="49.32" y2="43" />
          <polygon points="32,26 38.06,29.5 38.06,36.5 32,40 25.94,36.5 25.94,29.5" />
        </g>
        <g fill="currentColor">
          <circle cx="32" cy="9.5" r="4.5" />
          <circle cx="11.65" cy="44.75" r="4.5" />
          <circle cx="52.35" cy="44.75" r="4.5" />
        </g>
      </svg>
    </div>
    <!-- Страховка: заставку снимает первый экран приложения (app/boot-splash.ts).
         Если скрипты не дошли или упали до него — снимает таймер: иначе вечная
         заставка закрывала бы и экран ошибки роутера. -->
    <script>
      setTimeout(function () {
        var splash = document.getElementById('nodus-boot-splash');
        if (splash) splash.remove();
      }, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
