[package]
name = "nodus-desktop"
version = "1.0.0"
description = "Nodus — десктоп-оболочка портала (тонкий клиент, ADR-0019)"
authors = ["Nodus"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "nodus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Состояние главного окна между запусками (#722, ADR-0039): размер, позиция,
# maximized/fullscreen. Официальный плагин Tauri 2; восстанавливает окно на
# on_window_ready (до нашего show — без мигания) и сохраняет на выходе.
tauri-plugin-window-state = "2"
# Буфер обмена (ADR-0055): ТОЛЬКО rust-side write_text из команды моста
# copy_text (лимит 4096); JS-guest-bindings не подключены, чтения нет.
# 2.5.0 поднимает эффективный MSRV до 1.95 — локальный и CI toolchain
# (stable 1.99) это покрывают.
tauri-plugin-clipboard-manager = "2"
# Win11 Snap Layouts для безрамочного окна (ADR-0055): невидимый Win32-оверлей
# HTMAXBUTTON над кнопкой максимизации панели (DOM id `portal-window-maximize`,
# задаётся при регистрации плагина в lib.rs). Страница рисует панель сама,
# плагин только создаёт оверлей и прокидывает hover (класс .is-hovered) и
# нативный клик maximize/restore; на Win10 — безопасный no-op. JS-пакет
# не нужен: скрипт инъекции самонастраивается, команды update/detach идут
# через capability.
tauri-plugin-snap-layout = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
log = "0.4"
# Конфиг-эндпоинт портала до навигации (экран подключения). rustls + ring —
# тот же стек, что у tauri-plugin-updater; проверка цепочки — platform-verifier
# по хранилищу Windows (внутренний CA доверяется). НЕ native-tls/Schannel:
# Avest CSP перехватывает InitializeSecurityContextW через AppInit_DLLs и
# роняет процесс на первом рукопожатии (#586, docs/gotchas/desktop.md).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Держать на той же линии rustls, что у reqwest/updater (CI проверяет одну версию).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Детектор активности пользователя (#254, модель Telegram): WH_KEYBOARD_LL +
# WH_MOUSE_LL — клики и клавиши БЕЗ движения мыши (GetLastInputInfo движение
# не различает). Только флаг «был ввод», ничего не логируется.
# `Win32_UI_Input_KeyboardAndMouse` нужен ради `SetFocus` — возврат клавиатуры
# в главный webview после попапа (#709, focus.rs).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
