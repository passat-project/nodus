# Права моста «веб-приложение портала → оболочка» (ADR-0019). Раздаются ТОЛЬКО
# runtime-capability с remote = origin сохранённого портала (см. bridge.rs);
# локальному UI не положены. Команды дисплея и навигации — без кредов и без
# произвольного выполнения; файловые команды (#558) ограничены UNC-путями из
# списка разрешённых серверов и проверяются в Rust.

[[permission]]
identifier = "allow-notify-popup"
description = "Показать попап уведомления (стек право-низ, важные — до реакции)."
commands.allow = ["notify_popup"]

[[permission]]
identifier = "allow-log-popup-diagnostic"
description = "Записать решение гейта попапа в лог оболочки (#811): только id и коды причин."
commands.allow = ["log_popup_diagnostic"]

[[permission]]
identifier = "allow-set-unread-badge"
description = "Задать счётчик непрочитанных (бейдж трея и панели задач)."
commands.allow = ["set_unread_badge"]

[[permission]]
identifier = "allow-flash-taskbar"
description = "Мигание значка на панели задач (внимание к новому сообщению)."
commands.allow = ["flash_taskbar"]

[[permission]]
identifier = "allow-open-external"
description = "Открыть ссылку системным приложением: http(s)/mailto/tel (ссылки портала)."
commands.allow = ["open_external"]

[[permission]]
identifier = "allow-open-unc-path"
description = "Открыть файл с разрешённого файлового сервера (только UNC из списка настроек)."
commands.allow = ["open_unc_path"]

[[permission]]
identifier = "allow-reveal-unc-path"
description = "Показать файл с разрешённого файлового сервера в проводнике (выделением)."
commands.allow = ["reveal_unc_path"]

[[permission]]
identifier = "allow-dismiss-popups"
description = "Погасить попапы беседы (портал открыл беседу — уведомления гаснут)."
commands.allow = ["dismiss_popups"]

[[permission]]
identifier = "allow-set-ui-theme"
description = "Тема UI портала для попапов (светлая/тёмная — следует за приложением)."
commands.allow = ["set_ui_theme"]

[[permission]]
identifier = "allow-get-shell-info"
description = "Версия и платформа оболочки (диагностика, поддержка)."
commands.allow = ["get_shell_info"]

[[permission]]
identifier = "allow-get-update-state"
description = "Состояние автообновления оболочки (точка «доступна новая версия»)."
commands.allow = ["get_update_state"]

[[permission]]
identifier = "allow-apply-update"
description = "Применить скачанное обновление: passive-установка и перезапуск (по клику пользователя)."
commands.allow = ["apply_update"]

[[permission]]
identifier = "allow-shell-ready"
description = "Сигнал «слушатели моста armed» — оболочка доставляет отложенный deep link."
commands.allow = ["shell_ready"]
