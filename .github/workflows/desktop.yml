name: desktop

# Десктоп-оболочка (#254, ADR-0019): build-гейт на windows-runner — сборка
# установщиков проверяется на каждый мерж, артефакты лежат в прогонах
# (retention 30 дней). Подписи и манифеста здесь НЕТ: ключ подписи живёт в
# окружении desktop-signing и выдаётся только подписанному выпуску
# (.github/workflows/desktop-release.yml) после подтверждения владельца.
# НИКАКОЙ публикации установщиков на GitHub: единственный канал раздачи —
# свой сервер (#300, NODUS_DESKTOP_DIR → /desktop/).

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

# Least-privilege (гайд GitHub «effective CI»): чтение репозитория; выкладка
# артефактов прогона не требует write-прав токена джобы.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri build (windows)
    runs-on: windows-latest
    steps:
      # Пины actions/* — полный SHA + комментарий версии (supply-chain hardening,
      # #412): Dependabot (github-actions, еженедельно) обновляет и SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Версия pnpm — из packageManager в package.json (как ci.yml):
      # явная version здесь конфликтовала с фиксацией и валила сборку.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # Тегами остаются только эти два: rust-toolchain@stable — движущийся
      # указатель стабильного toolchain (смысл действия), rust-cache@v2 —
      # обновляется автором в рамках v2; SHA-пин лишает их назначения.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Шаг «Rust fmt и clippy» (#606) требует этих компонентов: action
          # ставит --profile minimal и не должен зависеть от состава образа.
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Avest CSP перехватывает Schannel и роняет процесс (#586,
      # docs/gotchas/desktop.md): в оболочке TLS только через rustls.
      - name: Нет Schannel в оболочке
        shell: bash
        run: |
          cd apps/desktop/src-tauri
          tree=$(cargo tree -e normal --prefix none)
          if echo "$tree" | grep -E '^(native-tls|schannel) '; then
            echo "schannel/native-tls в дереве оболочки запрещён (#586)"; exit 1
          fi
          # Провайдер ставится в прямой rustls: две версии = reqwest без
          # провайдера = паника в Client::build.
          if [ "$(echo "$tree" | grep -oE '^rustls v[^ ]+' | sort -u | wc -l)" -ne 1 ]; then
            echo "$tree" | grep -oE '^rustls v[^ ]+' | sort -u
            echo "в дереве должна быть ровно одна версия rustls (#586)"; exit 1
          fi

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Контракты → мини-UI оболочки
        run: |
          pnpm --filter @nodus/contracts build
          pnpm --filter @nodus/desktop build

      # После мини-UI: generate_context! требует собранный frontendDist (#606).
      - name: Rust fmt и clippy
        shell: bash
        run: |
          cd apps/desktop/src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Сборка установщиков
        shell: bash
        run: |
          cd apps/desktop
          pnpm exec tauri build

      - name: Артефакты сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nodus-desktop-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          # Публичный репозиторий: артефакты прогонов видны любому
          # залогиненному пользователю GitHub — держим окно минимальным (#562).
          retention-days: 14
