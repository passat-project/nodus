name: desktop-release

# Подписанный выпуск оболочки (#562, дополнение ADR-0019): ручной запуск с
# main, окружение desktop-signing — GitHub ждёт подтверждения владельца и
# только потом выдаёт ключ подписи. Установщики НЕ публикуются на GitHub
# (#300): артефакт прогона забирает scripts/desktop-publish.mjs на сервере
# портала — он проверяет подпись, версию и URL и раскладывает версию в
# releases/<v>/ с атомарной заменой latest.json.
#
# Почему отдельный workflow, а не job в desktop.yml: сборочный гейт бегает на
# каждый пуш в main, а обязательный ревьюер окружения требовал бы Approve на
# каждый коммит. Гейт остаётся без секретов, подпись — только здесь.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Что нового в версии (видят сотрудники в попапе обновления)'
        required: true
        type: string

# Least-privilege: ключ подписи приходит из окружения, репозиторий только читаем.
permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Подписанный выпуск (windows)
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: desktop-signing
    steps:
      # Пины actions/* — полный SHA + комментарий версии (supply-chain hardening,
      # #412): Dependabot (github-actions, еженедельно) обновляет и SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Версия pnpm — из packageManager в package.json (как ci.yml и desktop.yml).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # В ЭТОЙ job живёт ключ подписи, поэтому оба действия запинены на коммит
      # (в desktop.yml они на тегах: смысл rust-toolchain@stable — движущийся
      # указатель, но там ключа нет). Угон тега или отравленный action здесь =
      # утечка приватного ключа и подписанные вредоносные обновления на весь
      # парк. Обновлять пины — Dependabot'ом вместе с остальными actions.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Контракты → мини-UI оболочки
        run: |
          pnpm --filter @nodus/contracts build
          pnpm --filter @nodus/desktop build

      - name: Версия выпуска
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Пустой ключ — явная ошибка, а не «собрали без подписи»: выпуск без
      # подписи оболочка отвергнет (requireSignedVersion), а манифест без
      # version: — класс инцидента 1.0.7/1.0.8.
      - name: Сборка и подпись
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::в окружении desktop-signing нет TAURI_SIGNING_PRIVATE_KEY — подпись невозможна"
            exit 1
          fi
          cd apps/desktop
          pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Манифест и сбор файлов выпуска
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.version.outputs.version }}
          OUT: ${{ runner.temp }}/desktop-release
          # Git Bash на windows-раннере переписывает аргументы, начинающиеся с
          # «/», в пути вида C:/Program Files/Git/desktop/... — префикс URL
          # приезжает в скрипт искажённым и валит проверку формата.
          MSYS_NO_PATHCONV: '1'
        run: |
          node scripts/desktop-manifest.mjs --notes "$NOTES" --url-prefix "/desktop/releases/$VERSION/" --out "$OUT/latest.json"
          B=apps/desktop/src-tauri/target/release/bundle
          cp "$B/nsis/Nodus_${VERSION}_x64-setup.exe" "$B/nsis/Nodus_${VERSION}_x64-setup.exe.sig" "$OUT/"
          if compgen -G "$B/msi/Nodus_${VERSION}_x64*.msi" > /dev/null; then
            cp "$B"/msi/Nodus_${VERSION}_x64*.msi "$OUT/"
          fi
          if compgen -G "$B/msi/Nodus_${VERSION}_x64*.msi.sig" > /dev/null; then
            cp "$B"/msi/Nodus_${VERSION}_x64*.msi.sig "$OUT/"
          fi
          ls -la "$OUT"

      # Самопроверка теми же правилами, что применит выкладка: чужой ключ,
      # подпись без version:, URL вне releases/<v> — падают здесь, а не на сервере.
      - name: Самопроверка выпуска
        shell: bash
        run: node scripts/desktop-publish.mjs --from "${{ runner.temp }}/desktop-release" --dest "${{ runner.temp }}/publish-check" --dry-run

      - name: Артефакт выпуска
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nodus-desktop-release-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/desktop-release/
          if-no-files-found: error
          # Артефакт — только транспорт «CI → сервер портала». Репозиторий
          # публичный, артефакты прогонов доступны любому залогиненному
          # пользователю GitHub: держим минимальное окно (#562, security-review).
          retention-days: 14
