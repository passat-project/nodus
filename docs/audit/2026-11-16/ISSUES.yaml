- id: "AUD-012"
  title: "Один падающий обработчик события не даёт сработать остальным подписчикам этого события"
  type: "bug"
  priority: "P1"
  area: ["api"]
  module: ["core"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф2"
  depends_on: []
  blocks: ["AUD-011"]
  known_issue: null
  evidence:
    - "apps/api/src/core/events/event-dispatcher.ts:137-142 — один try на цикл по обработчикам"
    - "apps/api/src/core/events/event-dispatcher.ts:150-162 — любая ошибка отправляет всё событие на повтор"
    - "apps/api/src/core/events/event-dispatcher.ts:182-195 — повторы без потолка, только предупреждение poison"
