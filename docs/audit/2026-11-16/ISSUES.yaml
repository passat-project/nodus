  problem: "При перетаскивании карточки в статус движок выбирает одну кнопку, применяет её окно и замки, а затем, если её гейты не прошли, молча исполняет другую кнопку в тот же статус. Обязательное окно фактически исполненной кнопки не проверяется, а в журнал попадает смесь: замки от одной кнопки, переход от другой."
  expected: "Окно, замки, гейты, номера и запись в журнале относятся к одной и той же кнопке. Если гейты выбранной кнопки не прошли, запасной кандидат допустим только когда у него нет обязательного окна и его замки применены вместо замков первой."
  fix_scope: "Определять исполняемую кнопку до применения окна и замков: сначала оценить гейты кандидатов, выбрать одну, проверить её окно, и только затем применять форму и замки. Если у единственного прошедшего кандидата есть обязательное окно, а форма не передана — отказ «нужно окно»."
  non_goals: "Изменение правил выбора кандидатов при явном transitionId; редактор маршрутов; новые типы гейтов."
  acceptance:
    - "Две кнопки в один статус, у первой гейт не проходит, у второй обязательное окно: перетаскивание возвращает ошибку «нужно окно», переход не выполняется"
    - "Две кнопки, вторая без окна: выполняется вторая, в журнале её transitionId, замки первой не применены"
    - "Выбор по transitionId не изменился"
    - "Существующие тесты движка зелёные; добавлен тест на случай picked ≠ pick"
  tests:
    - "unit: матрица «гейт первой × окно второй × замки»"
    - "integration: переход перетаскиванием с двумя кандидатами"
  risks: "Гейты оцениваются по фактам после окна (workflow-engine.ts:144-147); перестановка шагов может изменить исход для маршрутов, где окно заполняет поле, нужное гейту. Нужен тест на этот случай."
  rollback: "Revert коммита; схему не меняет."

