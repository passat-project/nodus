    - "unit: sync-методы не вызывают порт без tx внутри транзакции"
  risks: "Слишком малый statement_timeout оборвёт законные длинные операции (миграции идут отдельным клиентом — проверить). Чтение состава до транзакции меняет момент снимка — сохранить перечитывание под блокировкой беседы."
