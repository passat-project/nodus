    - "Автор, исключённый из беседы, получает 404 на офисную сессию и список версий своего вложения"
    - "Автор, оставшийся участником, работает с файлом как прежде"
    - "Файл, приложенный в две беседы: доступ есть, пока пользователь состоит хотя бы в одной"
    - "Файл, загруженный, но не отправленный, доступен владельцу"
  tests:
    - "unit: ChatFileAccess.check — участник, не-участник, файл в двух беседах, незаклеймленный файл"
    - "integration: исключение из беседы → resolveAccess даёт NOT_FOUND"
    - "security: прогон security-reviewer"
