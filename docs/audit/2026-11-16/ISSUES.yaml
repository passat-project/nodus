- id: "AUD-005"
  title: "Смена пользователя в одной вкладке: кэш запросов и черновики чата достаются следующему вошедшему"
  type: "bug"
  priority: "P1"
  area: ["web"]
  module: ["auth", "core"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф1"
  depends_on: []
  blocks: []
  known_issue: null
  evidence:
    - "apps/web/src/shared/auth-store.ts:63-69 — выход только ставит анонимное состояние"
    - "apps/web/src/shared/auth-store.ts:87-90 — сброс сессии при чужом refresh тоже без очистки"
    - "apps/web/src/shared/chat/chat-drafts-persist.ts:16 — ключ localStorage 'nodus-chat-drafts-v1' без пользователя"
    - "в apps/web/src нет ни одного вызова queryClient.clear() (grep)"
    - "(по отчёту) apps/web/src/app/app.tsx:6-15 — QueryClient создаётся на уровне модуля"
  problem: "На общем компьютере после выхода одного сотрудника следующий вошедший в ту же вкладку может увидеть письма, задачи и беседы предыдущего из кэша, без запроса к серверу. Черновики сообщений лежат в общем хранилище браузера: текст одного пользователя виден другому и может быть отправлен от его имени. Сохранённые фильтры — тот же класс."
  expected: "Любой переход «пользователь → аноним» и «пользователь A → пользователь B» полностью очищает кэш запросов и данные предыдущего пользователя в хранилище браузера."
  fix_scope: "Одна точка сброса сессии: при выходе и при обнаружении чужой сессии вызывать очистку кэша запросов и сброс персистентных сторов с личными данными (черновики чата, сохранённые фильтры). Ключи этих сторов привязать к идентификатору пользователя. Поправить тест выхода: он должен проверять кэш, а не только стор."
  non_goals: "Шифрование localStorage; серверное хранение черновиков; настройки оформления (тема, масштаб) остаются общими для устройства."
  acceptance:
    - "Вход A → открыть письма и задачи → выход → вход B в той же вкладке: ни один экран не показывает данные A до ответа сервера"
    - "Черновик, набранный A, не виден B; после повторного входа A его черновик на месте"
    - "Сохранённые фильтры A не применяются у B"
    - "Выход в другой вкладке и вход под B: первая вкладка сбрасывает кэш при обнаружении чужой сессии"
  tests:
    - "unit: выход очищает кэш запросов и сторы; ключ черновиков содержит id пользователя"
    - "e2e: два пользователя по очереди в одном контексте браузера — данные первого недоступны второму"
  risks: "Смена ключа хранилища: существующие черновики пользователей станут недоступны (пользователей пока нет — приемлемо). Нужна миграция или осознанный сброс."
  rollback: "Revert коммита; серверных данных не меняет."

- id: "AUD-006"
  title: "При недоступном Redis отключаются отзыв токенов уволенных и защита от перебора пароля"
  type: "bug"
  priority: "P1"
  area: ["api"]
  module: ["auth"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф1"
  depends_on: []
  blocks: []
  known_issue: null
  evidence:
    - "apps/api/src/modules/auth/revoked-users.store.ts:71-81 — при ошибке Redis isRevoked возвращает false"
    - "apps/api/src/modules/auth/revoked-users.store.ts:35-38 — решение задокументировано как осознанное"
    - "apps/api/src/modules/auth/login-throttle.service.ts:46-54 — isLocked при ошибке возвращает false"
    - "apps/api/src/core/redis/redis-command.ts:31-34 — при статусе не ready команда сразу бросает"
    - "apps/api/src/modules/auth/jwt-auth.guard.ts:49-51 — точка проверки отзыва"
  problem: "Обе защиты сознательно сделаны «пропускать при сбое», чтобы портал не вставал вместе с Redis. Побочный эффект: пока Redis недоступен, уволенный сотрудник работает до 15 минут по старому токену, а перебор пароля ничем не ограничен, кроме общего лимита на IP."
  expected: "Отказ Redis не выключает защиту молча: проверка отзыва переходит на запасной источник, перебор пароля ограничен и без Redis, сбой заметен в логах как ошибка."
  fix_scope: "В isRevoked при ошибке Redis — запасная проверка статуса пользователя по БД (деактивирован → отозван). В троттлинге входа — запасной счётчик в памяти процесса на время недоступности Redis. Уровень лога — error с отдельным признаком для алерта."
  non_goals: "Fail-closed (превратит отказ Redis в отказ портала); лимит входа по IP (F-01-02 — замер в #473); кластер Redis."
  acceptance:
    - "Redis остановлен: запрос токеном деактивированного пользователя получает 401"
    - "Redis остановлен: одиннадцатая неудачная попытка входа по одному email отклоняется как заблокированная"
    - "Redis остановлен: действующие пользователи продолжают работать"
    - "В логе при недоступном Redis есть запись уровня error не чаще раза в минуту"
  tests:
    - "unit: isRevoked при ошибке Redis обращается к БД; счётчик в памяти блокирует после порога и сбрасывается при успехе"
