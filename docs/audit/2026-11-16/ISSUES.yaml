- id: "AUD-002"
  title: "Снятая роль действует до 15 минут — разжалованный администратор может вернуть себе права"
  type: "bug"
  priority: "P1"
  area: ["api"]
  module: ["auth", "directory"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф1"
  depends_on: ["AUD-001"]
  blocks: []
  known_issue: null
  evidence:
    - "apps/api/src/modules/auth/jwt-auth.guard.ts:53-58 — права пользователя берутся из payload токена"
    - "apps/api/src/modules/auth/events/user-deactivated.handler.ts:31-32 — единственное место, где отзываются сессии и пишется стоп-лист"
    - "apps/api/src/modules/auth/revoked-users.store.ts:57-68 — механизм отзыва по моменту времени уже есть"
    - "apps/api/src/modules/directory/role-members.service.ts:101 — проверка «нельзя назначить роль с чужими правами» читает actor.permissions из токена"
    - "apps/api/src/modules/directory/roles.service.ts:58,107,160 — то же для создания и правки роли"
  problem: "Права зашиты в access-токен на 15 минут. Снятие роли или изменение её прав не отзывает уже выданные токены. Разжалованный администратор за это окно может создать роль и назначить её себе: проверки эскалации сравнивают с правами из старого токена. После обновления токена возвращённые права уже законно лежат в БД."
  expected: "Изменение состава ролей пользователя или набора прав роли немедленно обесценивает ранее выданные токены затронутых пользователей; следующий запрос идёт с правами из БД."
  fix_scope: "При изменении членства в роли и при изменении прав роли вызывать существующий RevokedUsersStore.revoke для затронутых пользователей (тот же механизм, что при увольнении; refresh-сессии не трогать — пользователь прозрачно получит новый токен). Дополнительно: маршруты управления ролями читают права актора из БД, а не из токена."
  non_goals: "Перевод авторизации на проверку прав из БД на каждом запросе; версия прав в JWT; изменение TTL токена."
  acceptance:
    - "[РЕПРО] Сценарий G-01-02 из AUD-001 воспроизведён либо зафиксировано, почему нет"
    - "После снятия роли следующий запрос старым токеном получает 401, клиент прозрачно обновляет токен и видит новые права"
    - "Разжалованный пользователь не может создать роль или назначить её себе ни одним запросом после снятия"
    - "Изменение набора прав роли отзывает токены всех её участников"
    - "Обычная работа остальных пользователей не прерывается"
  tests:
    - "unit: обработчики изменения членства и прав роли вызывают revoke для нужных пользователей"
    - "integration: выдать роль → токен → снять роль → запрос старым токеном даёт 401; попытка самоназначения даёт 403"
    - "security: прогон security-reviewer по диффу"
  risks: "Массовое изменение прав популярной роли вызовет разовое обновление токенов у многих пользователей. При недоступном Redis запись отзыва падает — поведение согласовать с AUD-006."
  rollback: "Revert коммита; данных и схемы не меняет."

- id: "AUD-003"
  title: "Канал проекта не применяет правила проекта: участник добавляет посторонних, пересылка обходит право публикации"
  type: "bug"
  priority: "P1"
  area: ["api"]
  module: ["chat", "projects"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф1"
  depends_on: ["AUD-001"]
  blocks: []
  known_issue: null
  evidence:
    - "apps/api/src/modules/chat/permissions.ts:20-26 — дефолтная матрица: addMembers 'member', post 'member'"
    - "apps/api/src/modules/chat/project-chat/project-chat.repository.ts:26-28 — канал создаётся с mergePermissions() без переопределений"
    - "apps/api/src/modules/chat/conversations/conversation-members.service.ts:114-117 — add разрешён для project_channel, состав проекта не проверяется"
    - "apps/api/src/modules/chat/messages/message-actions.service.ts:108-111 — пересылка проверяет только матрицу беседы"
    - "apps/api/src/modules/chat/messages/messages.service.ts:279-287 — обычная отправка в канал проекта проверяет projectChat.canPost"
    - "apps/api/src/modules/chat/project-chat/project-chat.service.ts:99-104 — лишнего участника убирает только следующий sync"
  problem: "Состав и право публикации в канале проекта должны определяться проектом. Сейчас любой участник канала, включая канал секретного проекта, может добавить в него любого действующего сотрудника, и тот читает историю до ближайшей синхронизации состава. Отдельно: пересылка сообщения в канал проходит по общей матрице беседы и обходит право project.channel.post."
  expected: "В канал проекта нельзя добавить или исключить участника вручную — состав ведёт только проект. Корневое сообщение в канале, включая пересланное, может опубликовать только тот, кому это разрешает проект."
  fix_scope: "Убрать project_channel из разрешённых типов ручного добавления и исключения участников. В пересылке для project_channel применять ту же проверку canPost, что в обычной отправке."
  non_goals: "Новая модель прав каналов; миграция матриц существующих каналов; изменения интерфейса сверх скрытия кнопки «Добавить участника» в канале проекта."
  acceptance:
    - "[РЕПРО] Сценарий G-01-06 из AUD-001 воспроизведён на секретном проекте либо зафиксировано, почему нет"
    - "Ручное добавление участника в канал проекта возвращает 403/422 для любой роли в канале"
    - "Пересылка корневого сообщения в канал проекта без права публикации возвращает 403"
    - "Пересылка в тред канала и обычная отправка работают как прежде"
    - "Синхронизация состава из проекта по-прежнему добавляет и убирает участников"
  tests:
    - "integration: add в project_channel → отказ; forward без canPost → 403; forward с canPost → 201"
    - "unit: ветка project_channel в пересылке"
    - "e2e: существующий набор чата двух сессий остаётся зелёным"
    - "security: прогон security-reviewer"
  risks: "Если где-то в интерфейсе канал проекта полагался на ручное добавление — кнопка начнёт отдавать ошибку; проверить веб."
  rollback: "Revert коммита; данных не меняет."

- id: "AUD-004"
  title: "Исключённый из беседы автор сохраняет чтение и правку своих вложений"
  type: "bug"
  priority: "P1"
  area: ["api"]
  module: ["chat", "files"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф1"
  depends_on: ["AUD-001"]
  blocks: []
  known_issue: "#356 (родственный: уволенный сохраняет правку через открытую сессию редактора) — сослаться, не дублировать"
  evidence:
    - "apps/api/src/modules/chat/file-access/chat-file-access.provider.ts:25-33 — для не-участника возвращается { canView: false, canEdit: false } без deny"
    - "apps/api/src/modules/files/office/office-session.service.ts:38-39 — права стартуют с владения файлом"
    - "apps/api/src/modules/files/office/office-session.service.ts:50-56 — вето на просмотр и правку даёт только явный deny"
  problem: "Вложение принадлежит беседе, а не автору сообщения. Но владение файлом перебивает ответ чата «не участник»: исключённый из беседы автор по-прежнему открывает файл и может править его в офисном редакторе, причём правку увидят оставшиеся участники."
  expected: "Если файл приложен к сообщению беседы, а пользователь не состоит ни в одной беседе, где этот файл приложен, — доступа нет, даже у загрузившего."
  fix_scope: "В ChatFileAccess.check возвращать deny: true, когда файл привязан к сообщениям, а пользователь не участник ни одной из этих бесед. Незаклеймленная загрузка (файл ещё не приложен к сообщению) остаётся доступной владельцу."
  non_goals: "Отзыв уже открытой сессии редактора (#356); отзыв ранее выданных подписанных ссылок; пересмотр модели «вложение принадлежит беседе»."
  acceptance:
