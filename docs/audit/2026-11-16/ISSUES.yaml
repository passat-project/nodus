  expected: "Сбой одного подписчика не мешает остальным получить событие. Упавший подписчик повторяется отдельно; после исчерпания попыток событие помечается для разбора и перестаёт крутиться."
  fix_scope: "Ловить ошибку на каждом обработчике: остальные вызываются в любом случае; событие считается опубликованным, когда все обработчики отработали, упавшие повторяются с существующим бэкоффом. Добавить потолок попыток с записью уровня error и признаком для разбора."
  non_goals: "Переписывание шины событий; отдельная таблица dead-letter с интерфейсом; параллельная доставка; изменение порядка обработчиков."
  acceptance:
    - "Три подписчика, второй всегда падает: первый и третий получают событие ровно один раз"
    - "Упавший подписчик повторяется; после его починки событие доставляется ему и помечается опубликованным"
    - "После исчерпания попыток событие перестаёт повторяться, в логе запись error с id события и именем обработчика"
    - "Порядок доставки событий по seq не меняется"
  tests:
    - "unit: диспетчер с падающим обработчиком в начале, середине и конце списка"
    - "integration: существующие тесты outbox и идемпотентности зелёные"
  risks: "Меняется семантика: раньше подписчики получали события строго после успеха предыдущих. Если какой-то обработчик неявно полагался на результат другого — проявится. Проверить подписчиков одного события в разных модулях."
  rollback: "Revert коммита; зависшие события после отката снова уйдут в общий повтор."

