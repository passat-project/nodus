    - "(по отчёту) интеграционные наборы обёрнуты в describe.skipIf(!DATABASE_URL): без базы прогон зелёный с нулём тестов"
  problem: "Агент перед PR обязан прогнать гейты локально. Сейчас pnpm test падает на пяти тестах веба из-за значения в локальном .env — известная ловушка, на которую наступали больше десяти раз. А интеграционные тесты локально вообще не входят в гейт и без базы молча «проходят» с нулём выполненных. Локальное «зелено» не означает «в CI будет зелено»."
  expected: "pnpm test зелёный на чистом клоне при любом локальном .env. Есть одна команда, повторяющая обязательную проверку CI, и она явно падает, если интеграционные тесты не смогли выполниться."
  fix_scope: "В тестовом режиме веба принудительно выключать моки api, как это сделано для сборки. Добавить корневую команду локального гейта (lint, typecheck, test, интеграционные, build), которая при отсутствии базы и Redis завершается ошибкой, а не пропуском. Обновить CONTRIBUTING.md и DoD."
  non_goals: "Перенос интеграционных тестов в turbo test; ускорение набора; повышение порогов покрытия (#595)."
  acceptance:
    - "С VITE_API_MOCK=auth в .env pnpm test зелёный"
    - "Команда локального гейта без DATABASE_URL завершается с ошибкой и понятным сообщением"
    - "Команда локального гейта с поднятыми базой и Redis выполняет интеграционные тесты (число больше нуля в выводе)"
    - "CONTRIBUTING.md и DoD ссылаются на новую команду; запись в gotchas обновлена"
  tests:
    - "unit: существующие тесты веба при разных значениях VITE_API_MOCK"
    - "smoke: прогон локального гейта в двух режимах"
  risks: "Тесты, которые сознательно проверяют поведение с моками, должны включать их явно."
  rollback: "Revert коммита."

