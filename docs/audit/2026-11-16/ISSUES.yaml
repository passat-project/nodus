# Правила чтения:
# - priority — ПРЕДЛОЖЕНИЕ. По docs/process/workflow.md метку P0 назначает владелец.
# - status: ready — можно брать; draft — ждёт решения владельца (OWNER-QUESTIONS.md);
#   waiting-trigger — тематическая заготовка, берётся по триггеру из тела.
# - Метки GitHub собираются из полей: type:<type>, <priority>, area:<area>,
#   module:<module>, status:<status>. Словарь закрытый (workflow.md).
