- id: "AUD-015"
  title: "Два одновременных сохранения из офисного редактора пишут файл версии по одному ключу"
  type: "bug"
  priority: "P2"
  area: ["api"]
  module: ["files"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф2"
  depends_on: ["AUD-001"]
  blocks: []
  known_issue: null
  evidence:
    - "apps/api/src/modules/files/office/office-callback.service.ts:103,135 — номер следующей версии считается по чтению вне транзакции"
    - "apps/api/src/modules/files/office/office-callback.service.ts:147-148 — объект загружается по ключу files/<id>/v<N+1> до транзакции"
    - "apps/api/src/modules/files/office/office-callback.service.ts:150-170 — запись версии в транзакции; второй получает нарушение уникальности"
    - "apps/api/src/modules/files/office/office-callback.service.ts:114-121 — после сдвига версии колбэк с прежним ключом отбрасывается как устаревший"
    - "apps/api/src/modules/files/files.repository.ts:109-137 — saveVersion без блокировки строки файла"
  problem: "Аудит утверждал, что сохранение «зависает навсегда»; по коду это не так — повтор читает уже сдвинутую версию. Остаётся более узкий дефект: два параллельных колбэка загружают разные файлы по одному ключу, и содержимое версии N+1 может не совпасть с её записью (размер, автор сохранения), а сохранение проигравшего может быть молча отброшено."
  expected: "Каждое сохранение либо становится отдельной версией с собственным объектом, либо явно признаётся повтором; содержимое версии всегда соответствует её записи."
  fix_scope: "Брать блокировку строки файла первым шагом транзакции и внутри неё пересчитывать номер версии и дедуп; объект загружать по ключу, уникальному для попытки, и привязывать в транзакции; при откате удалять загруженный объект. Нарушение уникальности трактовать как «уже сохранено»."
  non_goals: "Совместное редактирование и разрешение конфликтов содержимого; отзыв сессий (#356); смена офисного движка (#140)."
  acceptance:
    - "[РЕПРО] Сценарий G-02-02 из AUD-001: зафиксировано, расходится ли объект со строкой версии"
    - "Два параллельных колбэка с разным содержимым: обе версии сохранены, размер каждого объекта равен размеру в записи"
    - "Повтор того же колбэка не создаёт новую версию и получает подтверждение"
    - "После отката транзакции в хранилище нет объекта-сироты"
  tests:
    - "integration: два параллельных колбэка на один файл"
    - "unit: дедуп внутри транзакции, компенсация объекта при откате"
  risks: "Удержание блокировки строки на время загрузки объекта недопустимо — загрузка должна оставаться вне транзакции, меняется только схема ключей."
  rollback: "Revert коммита; версии, сохранённые по новой схеме ключей, должны читаться старым кодом — ключ хранится в строке версии, проверить."

