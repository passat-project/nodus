- id: "AUD-018"
  title: "Ошибка цикла приёма почты завершает процесс api"
  type: "bug"
  priority: "P0"
  area: ["api"]
  module: ["correspondence", "core"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф3"
  depends_on: []
  blocks: ["AUD-019"]
  known_issue: null
  evidence:
    - "apps/api/src/modules/correspondence/mail/mail-inbox.service.ts:146-150 — setTimeout(() => void this.sync('idle'))"
    - "apps/api/src/modules/correspondence/mail/mail-inbox.service.ts:176-191 — sync не ловит исключение runCycle"
    - "apps/api/src/modules/correspondence/mail/mail-inbox.service.ts:245-250 — runCycle записывает сбой и пробрасывает ошибку"
    - "apps/api/src/modules/correspondence/mail/mail-inbox.service.ts:83-84 — setInterval(() => void this.ensureConnection()); armed() обращается к БД без catch (95-97)"
    - "apps/api/src/modules/correspondence/mail/mail-poll.job.ts:50-53 — фолбэк-опрос ту же ошибку ловит"
    - "в apps/api/src и apps/gateway/src нет обработчика unhandledRejection (grep)"
    - "docker-compose.yml:40 — restart: unless-stopped у api"
  problem: "Приём почты запускается по таймерам, и обещания этих запусков никто не ждёт и не ловит. Любой сбой в цикле — недоступный почтовый сервер, база, хранилище, проблемное письмо — становится необработанным отказом, на котором Node завершает процесс. Падает весь портал, а не только почта; при устойчивой причине — цикл перезапусков."
  expected: "Сбой приёма почты остаётся сбоем приёма почты: логируется, учитывается счётчиком неудач, повторяется по расписанию. Процесс api не завершается из-за фоновой задачи."
  fix_scope: "Добавить catch во все фоновые запуски в MailInboxService (idle-синхронизация, проверка соединения по таймеру, реконнект, повтор авторизации). Добавить глобальный обработчик необработанных отказов в api и gateway: запись error и продолжение работы. Тест с настоящими таймерами."
  non_goals: "Пропуск проблемного письма (AUD-019); переписывание приёма на очередь; изменение стратегии реконнекта."
  acceptance:
    - "Цикл приёма бросает ошибку: процесс жив, в логе «Цикл приёма не удался», счётчик неудач вырос"
    - "База недоступна в момент проверки флага по таймеру: процесс жив"
    - "Произвольный необработанный отказ в фоновой задаче: запись error, процесс жив, /health/ready отвечает"
    - "Тест исполняет таймеры по-настоящему, а не только вызывает методы напрямую"
  tests:
    - "unit: каждый фоновый запуск при ошибке не порождает необработанный отказ"
    - "integration: api стартует с недоступным IMAP и работает"
  risks: "Глобальный обработчик может скрыть настоящие дефекты — логировать уровнем error со стеком. Не глушить uncaughtException: синхронные исключения по-прежнему должны завершать процесс."
  rollback: "Revert коммита."

- id: "AUD-019"
  title: "Одно проблемное письмо останавливает весь приём почты"
  type: "bug"
  priority: "P1"
  area: ["api"]
  module: ["correspondence"]
  status: "ready"
  epic: "AUDIT-CUTOFF"
  phase: "Ф3"
  depends_on: ["AUD-001", "AUD-018"]
  blocks: []
  known_issue: null
  evidence:
    - "apps/api/src/modules/correspondence/mail/mail-letter-writer.ts:272-277 — при ошибке записи курсор не двигается, ошибка пробрасывается"
    - "apps/api/src/modules/correspondence/mail/mail-inbox.service.ts:225-231 — цикл по UID без обработки ошибки отдельного письма"
    - "apps/api/src/modules/correspondence/mail/mail-parser.service.ts:158-161 — обработчик error парсера только ставит флаг и не завершает промис"
    - "apps/api/src/modules/correspondence/mail/mail-parser.service.ts:163-175 — промис завершают только end и ошибка исходного потока"
    - "apps/api/src/modules/correspondence/mail/mail-inbox.service.ts:185-190 — running сбрасывается только по завершении цикла"
  problem: "Две независимые причины дают один итог. Письмо, которое не удаётся записать, обрабатывается заново в каждом цикле, и все письма после него не приходят. Письмо, на котором парсер выдал ошибку без завершения потока, оставляет цикл «выполняющимся» навсегда — без единой ошибки в логе; фолбэк-опрос при этом тоже пропускается."
  expected: "Проблемное письмо после ограниченного числа попыток пропускается с заметной записью, приём продолжается. Разбор письма ограничен по времени."
  fix_scope: "Счётчик попыток на UID: после N неудач курсор сдвигается, письмо создаётся с пометкой проблемы разбора или фиксируется как пропущенное с событием для канцелярии. В парсере: ошибка завершает разбор тем, что успело разобраться; общий таймаут на разбор одного письма."
  non_goals: "Интерфейс разбора пропущенных писем; повторная загрузка по кнопке; изменение правил антиспама и дедупа."
  acceptance:
    - "[РЕПРО] Сценарий G-12-01 из AUD-001: зафиксировано, зависает ли разбор на обрезанном письме"
    - "Письмо, запись которого стабильно падает: после N циклов пропущено, следующие письма приняты, в логе error с UID"
    - "Обрезанное посреди вложения письмо: разбор завершается в пределах таймаута, приём продолжается"
    - "Временный сбой (база недоступна один цикл): письмо не пропускается, принимается следующим циклом"
    - "Канцелярия получает уведомление о пропущенном письме"
  tests:
    - "unit: счётчик попыток и сдвиг курсора; парсер на обрезанном и на битом входе; таймаут разбора"
    - "integration: поток из трёх писем, второе стабильно падает"
  risks: "Потеря письма — худший исход: пропуск только после исчерпания попыток и только с заметным следом. Отличать временный сбой инфраструктуры от проблемы самого письма."
  rollback: "Revert коммита; курсор, сдвинутый за пропущенное письмо, назад не возвращается — пропущенные UID есть в логе."

